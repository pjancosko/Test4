<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bubble Sculpture (Optimized - 15 Bubbles)</title>

  <!-- Only A-Frame, no AR.js needed -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.loaders.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    
    /* Loading indicator */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
      z-index: 999;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
    }
  </style>

  <script>
    // ---------- Force Phong (run ONCE on template models) ----------
    AFRAME.registerComponent('force-phong', {
      schema: {
        shininess:   { default: 120 },  // Reduced for mobile
        baseOpacity: { default: 0.1 }
      },
      init () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;

          obj.traverse(n => {
            if (!n.isMesh || !n.material) return;

            const base = n.material;
            const phong = new THREE.MeshPhongMaterial({
              color:       0x222244,
              emissive:    0x060a2e,
              specular:    0x888888,  // Less intense for mobile
              shininess:   this.data.shininess,
              transparent: true,
              opacity:     (typeof base.opacity === 'number') ? base.opacity : this.data.baseOpacity,
              side:        THREE.DoubleSide,
              depthWrite:  false
            });

            // Only use texture map, skip normal map for performance
            if (base.map) phong.map = base.map;

            n.material = phong;
            n.material.needsUpdate = true;
          });
        });
      }
    });

    // ---------- Helper: deep clone a loaded Object3D ----------
    function cloneObject3D(src) {
      return src.clone(true);
    }

    // ---------- Bubble Pop (uses split template clone) ----------
    AFRAME.registerComponent('bubble-pop', {
      schema: {
        splitScaleMultiplier: { default: 1.5 },
        fadeDelay:            { default: 1000 },  // Reduced timings
        fadeDuration:         { default: 1500 }
      },

      init() {
        this.popped = false;
        this.el.classList.add('clickable');

        this.onInteract = this.onInteract.bind(this);
        this.el.addEventListener('click', this.onInteract);
        this.el.addEventListener('touchstart', this.onInteract);
      },

      onInteract(evt) {
        // Prevent double-firing on touch devices
        if (evt.type === 'touchstart') {
          evt.preventDefault();
        }
        this.popBubble();
      },

      popBubble() {
        if (this.popped) return;
        this.popped = true;

        const el = this.el;
        const parent = el.parentNode;
        if (!parent) return;

        // Create new audio instance for each pop (works better on mobile)
        const popSoundEl = document.querySelector('#popSound');
        if (popSoundEl && popSoundEl.src) {
          const audio = new Audio(popSoundEl.src);
          audio.volume = 0.5;
          audio.play().catch(e => console.log('Sound play failed:', e));
        }

        const pos = el.getAttribute('position');
        const rot = el.getAttribute('rotation');
        const scale = el.getAttribute('scale');

        // Hide bubble
        el.setAttribute('visible', false);

        // Get split template mesh
        const splitTemplateEl = document.querySelector('#splitTemplate');
        const splitTemplateMesh = splitTemplateEl && splitTemplateEl.getObject3D('mesh');
        if (!splitTemplateMesh) {
          // Fallback: if template not ready, just remove bubble
          return;
        }

        // Create split entity and attach cloned mesh
        const split = document.createElement('a-entity');
        split.setAttribute('position', pos);
        split.setAttribute('rotation', rot);

        const finalScale = {
          x: scale.x * this.data.splitScaleMultiplier,
          y: scale.y * this.data.splitScaleMultiplier,
          z: scale.z * this.data.splitScaleMultiplier
        };
        split.setAttribute('scale', `${finalScale.x} ${finalScale.y} ${finalScale.z}`);

        // Attach cloned mesh immediately
        split.addEventListener('loaded', () => {
          const clone = cloneObject3D(splitTemplateMesh);

          // Clone materials so fading doesn't affect template or other splits
          clone.traverse(n => {
            if (n.isMesh && n.material) {
              n.material = n.material.clone();
              n.material.transparent = true;
              n.material.depthWrite = false;
            }
          });

          split.setObject3D('mesh', clone);

          // Start animation + fade after mesh is attached
          split.setAttribute('animation-mixer', 'loop: once; clampWhenFinished: true');
          this.startSplitFade(split);
        });

        parent.appendChild(split);
      },

      startSplitFade(splitEl) {
        const mesh = splitEl.getObject3D('mesh');
        if (!mesh) return;

        const materials = [];
        mesh.traverse(n => {
          if (n.isMesh && n.material) {
            materials.push({
              material: n.material,
              startOpacity: (typeof n.material.opacity === 'number') ? n.material.opacity : 1
            });
          }
        });

        const fadeDelay = this.data.fadeDelay;
        const fadeDuration = this.data.fadeDuration;

        const startFade = () => {
          const startTime = performance.now();
          const step = (now) => {
            const t = Math.min((now - startTime) / fadeDuration, 1);
            materials.forEach(m => {
              m.material.opacity = m.startOpacity * (1 - t);
            });

            if (t < 1) {
              requestAnimationFrame(step);
            } else {
              if (splitEl.parentNode) splitEl.parentNode.removeChild(splitEl);
            }
          };
          requestAnimationFrame(step);
        };

        if (fadeDelay > 0) setTimeout(startFade, fadeDelay);
        else startFade();
      },

      remove() {
        this.el.removeEventListener('click', this.onInteract);
        this.el.removeEventListener('touchstart', this.onInteract);
      }
    });

    // ---------- Random bubble ring (clones bubble template mesh) ----------
    AFRAME.registerComponent('random-bubble-ring', {
      schema: {
        count:        { default: 6 },  // Reduced default
        radius:       { default: 5 },
        y:            { default: 0 },
        scale:        { default: 9 },
        radiusJitter: { default: 1.0 },
        heightJitter: { default: 1.0 },
        depthJitter:  { default: 1.2 },
        scaleJitter:  { default: 0.9 }
      },

      init() {
        const templateEl = document.querySelector('#bubbleTemplate');

        const build = () => {
          const templateMesh = templateEl && templateEl.getObject3D('mesh');
          if (!templateMesh) return;

          const data = this.data;

          for (let i = 0; i < data.count; i++) {
            const angle = (i / data.count) * Math.PI * 2;

            const radialOffset = (Math.random() - 0.5) * data.radiusJitter;
            const r = data.radius + radialOffset;

            let x = Math.cos(angle) * r;
            let z = Math.sin(angle) * r;

            z += (Math.random() - 0.5) * data.depthJitter;
            const y = data.y + (Math.random() - 0.5) * data.heightJitter;

            const scaleFactor = 1 - data.scaleJitter / 2 + Math.random() * data.scaleJitter;
            const finalScale = data.scale * scaleFactor;

            const bubble = document.createElement('a-entity');

            // Attach cloned mesh
            bubble.addEventListener('loaded', () => {
              const clone = cloneObject3D(templateMesh);
              bubble.setObject3D('mesh', clone);
            });

            bubble.setAttribute('bubble-pop', '');
            bubble.setAttribute('position', `${x} ${y} ${z}`);
            bubble.setAttribute('scale', `${finalScale} ${finalScale} ${finalScale}`);
            bubble.setAttribute(
              'rotation',
              `${(Math.random() - 0.5) * 20} ${(Math.random()*360).toFixed(1)} ${(Math.random() - 0.5) * 20}`
            );

            this.el.appendChild(bubble);
          }
        };

        if (templateEl) {
          templateEl.addEventListener('model-loaded', build);
          // If already loaded, build right away
          if (templateEl.hasLoaded && templateEl.getObject3D('mesh')) build();
        }
      }
    });

    // Hide loading indicator when scene is ready
    window.addEventListener('load', () => {
      const scene = document.querySelector('a-scene');
      const loading = document.getElementById('loading');
      
      if (scene.hasLoaded) {
        setTimeout(() => {
          loading.style.display = 'none';
        }, 1000);
      } else {
        scene.addEventListener('loaded', () => {
          setTimeout(() => {
            loading.style.display = 'none';
          }, 1000);
        });
      }
    });
  </script>
</head>

<body>
  <!-- Loading indicator -->
  <div id="loading">Loading Bubble Sculpture...<br><span style="font-size: 14px;">Please wait</span></div>
  
  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="antialias:false; colorManagement:false; maxCanvasWidth:1920; maxCanvasHeight:1920">

    <!-- Camera + fuse cursor -->
    <a-camera>
      <a-entity
        cursor="rayOrigin: entity; fuse: true; fuseTimeout: 100"
        raycaster="objects: .clickable; far: 50"
        geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
        material="color: #FFFFFF; shader: flat; opacity: 0.8"
        position="0 0 -1">
      </a-entity>
    </a-camera>

    <!-- Assets -->
    <a-assets timeout="30000">
      <a-asset-item id="bubbleModel" src="wobble5.glb"></a-asset-item>
      <a-asset-item id="bubbleSplitModel" src="BubbleSplit.glb"></a-asset-item>
      <audio id="popSound" src="bubble-pop-06-351337.mp3" preload="auto"></audio>
    </a-assets>

    <!-- Hidden templates (load ONCE, then clone their meshes) -->
    <a-entity id="bubbleTemplate" gltf-model="#bubbleModel" force-phong visible="false"></a-entity>
    <a-entity id="splitTemplate" gltf-model="#bubbleSplitModel" force-phong visible="false"></a-entity>

    <!-- Simplified lights for mobile -->
    <a-entity light="type:ambient; intensity:1.2; color:#FA7AAE"></a-entity>
    <a-entity position="1 2 -1" light="type:directional; intensity:0.8; color:#8BFCFC"></a-entity>
    <a-entity light="type:hemisphere; color:#AAFFFF; groundColor:#0088FF; intensity:1.0"></a-entity>

    <!-- Sculpture with 15 total bubbles -->
    <a-entity
      id="bubble-sculpture"
      position="0 -0.5 -6"
      animation__float="property: position.y; from:-0.8; to:0.8; dur:14000; dir:alternate; loop:true; easing:easeInOutSine">

      <!-- Center bubble (1) -->
      <a-entity id="centerBubble" bubble-pop position="0 0 0" scale="30 30 30"></a-entity>

      <!-- Outer ring: 6 bubbles -->
      <a-entity
        id="ring-outer"
        animation__spin="property: rotation.y; to:360; loop:true; dur:50000; easing:linear"
        random-bubble-ring="count:6; radius:3; y:0; scale:12; radiusJitter:1.5; heightJitter:1.2; depthJitter:1.5; scaleJitter:0.8">
      </a-entity>

      <!-- Upper ring: 4 bubbles -->
      <a-entity
        id="ring-upper"
        animation__spin="property: rotation.y; to:-360; loop:true; dur:60000; easing:linear"
        random-bubble-ring="count:4; radius:2.6; y:2.0; scale:12; radiusJitter:0.8; heightJitter:0.8; depthJitter:1.0; scaleJitter:0.4">
      </a-entity>

      <!-- Lower ring: 4 bubbles -->
      <a-entity
        id="ring-lower"
        animation__spin="property: rotation.y; to:360; loop:true; dur:55000; easing:linear"
        random-bubble-ring="count:4; radius:2.4; y:-2.0; scale:12; radiusJitter:1.0; heightJitter:1.0; depthJitter:1.3; scaleJitter:0.6">
      </a-entity>
    </a-entity>

    <script>
      // Clone template mesh into center bubble once template is loaded
      const templateEl = document.querySelector('#bubbleTemplate');
      const centerEl = document.querySelector('#centerBubble');

      const attachCenterBubble = () => {
        const mesh = templateEl.getObject3D('mesh');
        if (!mesh) return;
        const clone = mesh.clone(true);
        centerEl.setObject3D('mesh', clone);
      };

      if (templateEl.hasLoaded && templateEl.getObject3D('mesh')) {
        attachCenterBubble();
      } else {
        templateEl.addEventListener('model-loaded', attachCenterBubble);
      }

      // Log when everything is ready (for debugging)
      document.querySelector('a-scene').addEventListener('loaded', () => {
        console.log('Scene loaded - Total bubbles: 15 (1 center + 6 outer + 4 upper + 4 lower)');
      });
    </script>

  </a-scene>
</body>
</html>
