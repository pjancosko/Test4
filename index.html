<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- A-Frame + AR.js + loaders -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://rawgit.com/donmccurdy/aframe-extras/v6.0.0/dist/aframe-extras.loaders.min.js"></script>
  <!-- Look-at for text -->
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <style>body{margin:0;overflow:hidden}</style>

  <script>
    // -------- Shared Webcam Texture --------
    let sharedVideoTexture = null;
    let sharedVideoElement = null;

    AFRAME.registerComponent('webcam-bubble', {
      schema: {
        radius: { type: 'number', default: 0.25 }
      },
      init: function () {
        const self = this;
        function waitForVideo() {
          if (!sharedVideoElement) {
            const video = document.querySelector('video');
            if (video && video.readyState >= 2) {
              sharedVideoElement = video;
              if (!sharedVideoTexture) {
                const THREE = window.THREE;
                sharedVideoTexture = new THREE.VideoTexture(sharedVideoElement);
                sharedVideoTexture.minFilter = THREE.LinearFilter;
                sharedVideoTexture.magFilter = THREE.LinearFilter;
                sharedVideoTexture.format = THREE.RGBFormat;
              }
              self.createBubble();
            } else {
              setTimeout(waitForVideo, 200);
            }
          } else {
            self.createBubble();
          }
        }
        waitForVideo();
      },
      createBubble: function () {
        const THREE = window.THREE;
        if (!THREE || !sharedVideoTexture) return;

        // Slightly lower geometry segments for performance
        const geom = new THREE.SphereGeometry(this.data.radius, 16, 16);
        const mat = new THREE.MeshBasicMaterial({
          map: sharedVideoTexture,
          transparent: true,
          opacity: 0.25,
          side: THREE.BackSide,
          depthWrite: false,
          depthTest: true
        });

        const mesh = new THREE.Mesh(geom, mat);
        mesh.renderOrder = 2;
        this.el.setObject3D('mesh', mesh);
      }
    });

    AFRAME.registerComponent('force-phong', {
      schema: {
        shininess: { default: 180 },
        baseOpacity: { default: 0.08 }
      },
      init () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;

          obj.traverse(n => {
            if (!n.isMesh || !n.material) return;

            const base = n.material;
            const phong = new THREE.MeshPhongMaterial({
              color: 0x222244,
              emissive: 0x060a2e,
              specular: 0xffffff,
              shininess: this.data.shininess,
              transparent: true,
              opacity: (typeof base.opacity === 'number')
                         ? base.opacity
                         : this.data.baseOpacity,
              side: THREE.DoubleSide,
              depthWrite: false
            });

            if (base.map) phong.map = base.map;
            if (base.normalMap) phong.normalMap = base.normalMap;

            n.material = phong;
            n.material.needsUpdate = true;
          });
        });
      }
    });

    // ------------------ Bubble Fade ------------------
    AFRAME.registerComponent('bubble-fade', {
      schema: {
        from: { type: 'number', default: 0.07 },
        to: { type: 'number', default: 0.0 },
        dur: { type: 'number', default: 8000 },
        delay: { type: 'number', default: 4000 }
      },
      init () {
        this.materials = [];
        this.startTime = null;
        this.isAnimating = false;

        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;
          obj.traverse(n => {
            if (n.isMesh && n.material) {
              this.materials.push(n.material);
            }
          });
        });

        this.el.addEventListener('start-fade', () => {
          setTimeout(() => {
            this.startTime = performance.now();
            this.isAnimating = true;
          }, this.data.delay);
        });
      },
      tick () {
        if (!this.isAnimating || !this.startTime) return;
        const elapsed = performance.now() - this.startTime;
        const progress = Math.min(elapsed / this.data.dur, 1);
        const newOp = this.data.from * (1 - progress) + this.data.to * progress;

        this.materials.forEach(m => {
          m.opacity = newOp;
          m.needsUpdate = true;
        });

        if (progress >= 1) this.isAnimating = false;
      }
    });

    // ------------------ Poem Data ------------------
    const POEM = [
      { text: "are" },
      { text: "you" },
      { text: "seeing" },
      { text: "mirrors" },
      { text: "seeing" },
      { text: "only" },
      { text: "what" },
      { text: "pleases" },
      { text: "reflections" },
      { text: "sameness" },
      { text: "comfort" },
      { text: "or bursting" },
      { text: "learning" },
      { text: "growing" }
    ];

    // ------------------ Multiple Bubbles with Sequential Text ------------------
    window.addEventListener('DOMContentLoaded', () => {
      const rig = document.querySelector('#rig');
      const MAX_BUBBLES = 3;
      const SPAWN_INTERVAL = 3000;

      // ---- Mobile-aware sizing so bubbles are visible on phones ----
      const IS_MOBILE = AFRAME.utils && AFRAME.utils.device
        ? AFRAME.utils.device.isMobile()
        : /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      const BUBBLE_SCALE = IS_MOBILE ? 3.2 : 2.2;   // scale up more on phones
      const CLICK_RADIUS = IS_MOBILE ? 0.45 : 0.35; // easier to tap on phones

      let currentTextIndex = 0;  // Which poem text to show next
      let activeContainers = [];
      let poemComplete = false;

      function removeContainer(container) {
        activeContainers = activeContainers.filter(c => c !== container);
        if (rig.contains(container)) {
          rig.removeChild(container);
        }
      }

      // Spawn closer to camera and nearer center so bubbles stay in view
      function randomBubbleStartPosition() {
        const xRange = IS_MOBILE ? 0.35 : 0.6;   // narrower horizontally on phones
        const zNear = IS_MOBILE ? -0.9 : -1.2;
        const zFar  = IS_MOBILE ? -0.7 : -1.0;
        const yMin  = IS_MOBILE ? -0.1 : -0.4;
        const yMax  = IS_MOBILE ?  0.25 :  0.1;

        const x = (Math.random() * 2 - 1) * xRange;
        const z = zNear + Math.random() * (zFar - zNear);
        const y = yMin + Math.random() * (yMax - yMin);

        return { x, y, z };
      }

      function spawnBubble() {
        if (activeContainers.length >= MAX_BUBBLES) return;
        if (poemComplete && currentTextIndex >= POEM.length) return;

        const container = document.createElement('a-entity');
        const startPos = randomBubbleStartPosition();

        const startY = startPos.y;
        const endY = startY + 1.6 + Math.random() * 0.4;

        container.setAttribute('position', `${startPos.x} ${startY} ${startPos.z}`);
        container.setAttribute('rotation',
          `${15 + (Math.random()*10-5)} ${15 + (Math.random()*20-10)} ${15 + (Math.random()*10-5)}`);
        container.setAttribute('scale', `${BUBBLE_SCALE} ${BUBBLE_SCALE} ${BUBBLE_SCALE}`);

        const riseDur = 18000 + Math.random() * 7000;

        container.setAttribute(
          'animation__rise',
          `property: position; dur: ${riseDur}; easing: easeInOutSine; to: ${startPos.x} ${endY} ${startPos.z}`
        );

        container.addEventListener('animationcomplete__rise', () => {
          if (rig.contains(container)) {
            removeContainer(container);
          }
        });

        // Inner wobble GLB
        const model = document.createElement('a-entity');
        model.setAttribute('gltf-model', '#myModel');
        model.setAttribute('force-phong', 'shininess:400');
        model.setAttribute('animation-mixer', 'loop: repeat');
        model.setAttribute('position', '0 0 0');
        container.appendChild(model);

        // Outer webcam shell
        const webcamShell = document.createElement('a-entity');
        webcamShell.setAttribute('position', '0 0 0');

        model.addEventListener('model-loaded', () => {
          const obj = model.getObject3D('mesh');
          if (!obj) return;

          const box = new THREE.Box3().setFromObject(obj);
          const size = new THREE.Vector3();
          box.getSize(size);

          const wobbleRadius = Math.max(size.x, size.y, size.z) / 2;
          const shellRadius = wobbleRadius * 0.75;  // keep your 0.75 relationship

          webcamShell.setAttribute('webcam-bubble', `radius:${shellRadius}`);
        });

        container.appendChild(webcamShell);

        // Click helper
        const clickSphere = document.createElement('a-sphere');
        clickSphere.setAttribute('radius', CLICK_RADIUS.toString());
        clickSphere.setAttribute('material', 'opacity:0; transparent:true');
        clickSphere.classList.add('clickable');
        container.appendChild(clickSphere);

        // Click handler
        let clicked = false;
        container.addEventListener('click', () => {
          if (clicked) return;
          if (currentTextIndex >= POEM.length) {
            // Poem complete, just pop bubble without text
            clicked = true;
            removeContainer(container);
            return;
          }
          clicked = true;

          const stanza = POEM[currentTextIndex];
          currentTextIndex++;

          console.log(`💥 Showing text ${currentTextIndex}/${POEM.length}: "${stanza.text}"`);

          const worldPos = container.object3D.getWorldPosition(new THREE.Vector3());
          const worldRot = container.object3D.rotation;
          const worldScale = container.object3D.getWorldScale(new THREE.Vector3());

          removeContainer(container);

          // Split GLB
          const split = document.createElement('a-entity');
          split.setAttribute('gltf-model', '#mySplit');
          split.setAttribute('position',
            `${worldPos.x} ${worldPos.y} ${worldPos.z}`);
          split.setAttribute('rotation',
            `${worldRot.x * 180/Math.PI} ${worldRot.y * 180/Math.PI} ${worldRot.z * 180/Math.PI}`);
          split.setAttribute('scale',
            `${worldScale.x} ${worldScale.y} ${worldScale.z}`);
          split.setAttribute('force-phong', 'shininess:800');
          split.setAttribute('bubble-fade',
            'from:0.07; to:0; dur:8000; delay:4000');
          split.setAttribute('animation-mixer',
            'clip:*; loop:once; repetitions:1; clampWhenFinished:true');
          rig.appendChild(split);

          setTimeout(() => {
            split.emit('start-fade');
          }, 100);

          // Text
          const txt = document.createElement('a-entity');
          txt.setAttribute('text', {
            value: stanza.text,
            color: '#A8DBE6',
            align: 'center',
            width: 1.5,
            font: 'kelsonsans'
          });
          txt.setAttribute('material', 'transparent:true; opacity:1');
          txt.setAttribute('position',
            `${worldPos.x} ${worldPos.y + 0.2} ${worldPos.z + 0.4}`);
          txt.setAttribute('look-at', '[camera]');
          txt.setAttribute(
            'animation__fadeout',
            'property: material.opacity; from:1; to:0; dur:1500; startEvents: fade-out'
          );
          rig.appendChild(txt);

          setTimeout(() => {
            txt.emit('fade-out');
          }, 3000);

          setTimeout(() => {
            if (rig.contains(txt)) rig.removeChild(txt);
            if (rig.contains(split)) rig.removeChild(split);
          }, 10000);

          // Check if poem is complete
          if (currentTextIndex >= POEM.length) {
            poemComplete = true;
            console.log('🎉 Poem complete! Waiting for remaining bubbles to clear...');

            // After all text shown, wait then restart
            setTimeout(() => {
              console.log('🔄 Restarting poem sequence...');
              currentTextIndex = 0;
              poemComplete = false;
            }, 20000);
          }
        });

        rig.appendChild(container);
        activeContainers.push(container);
      }

      // Continuous spawning
      setInterval(() => {
        spawnBubble();
      }, SPAWN_INTERVAL);

      // Initial bubbles
      setTimeout(() => spawnBubble(), 500);
      setTimeout(() => spawnBubble(), 2000);
      setTimeout(() => spawnBubble(), 3500);
    });
  </script>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="physicallyCorrectLights:true;antialias:true;logarithmicDepthBuffer:true;colorManagement:true;toneMapping:ACESFilmic;exposure:1.9"
    arjs="sourceType:webcam;trackingMethod:best;debugUIEnabled:false">

    <!-- Assets -->
    <a-assets timeout="60000">
      <a-asset-item id="myModel" src="wobble5.glb"></a-asset-item>
      <a-asset-item id="mySplit" src="BubbleSplit.glb"></a-asset-item>
    </a-assets>

    <!-- AR Camera with rig -->
    <a-entity camera arjs-camera id="arCam">
      <a-entity id="rig">
        <!-- Lights -->
        <a-entity light="type:ambient; intensity:10; color:#FA7AAE"></a-entity>
        <a-entity position="1 2 -1"
                  light="type:directional; intensity:8; color:#8BFCFC"></a-entity>
        <a-entity position="-2 2 1"
                  light="type:directional; intensity:8; color:#E65E63"></a-entity>
        <a-entity position="0.5 0.6 -0.8"
                  light="type:point; intensity:10; distance:4; color:#FFFFFF"></a-entity>
        <a-entity light="type:hemisphere; color:#AAFFFF; groundColor:#0088FF; intensity:2.5"></a-entity>
      </a-entity>
    </a-entity>

    <!-- Mouse raycaster -->
    <a-entity
      cursor="rayOrigin: mouse; fuse:false"
      raycaster="objects:.clickable; far:100; interval:100">
    </a-entity>

  </a-scene>
</body>
</html>
