<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- A-Frame + AR.js + loaders -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://rawgit.com/donmccurdy/aframe-extras/v6.0.0/dist/aframe-extras.loaders.min.js"></script>
  <!-- Look-at for text -->
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <style>body{margin:0;overflow:hidden}</style>

  <script>
    // -------- OPTIMIZED Webcam Bubble (shared texture, lower poly) --------
    let sharedVideoTexture = null;
    let sharedVideoElement = null;

    AFRAME.registerComponent('webcam-bubble', {
      schema: {
        radius: { type: 'number', default: 0.25 }
      },
      init: function () {
        this.mesh = null;
        
        const self = this;
        function waitForVideo() {
          if (!sharedVideoElement) {
            const video = document.querySelector('video');
            if (video && video.readyState >= 2) {
              sharedVideoElement = video;
              // Create ONE shared texture for all bubbles
              if (!sharedVideoTexture) {
                const THREE = window.THREE;
                sharedVideoTexture = new THREE.VideoTexture(sharedVideoElement);
                sharedVideoTexture.minFilter = THREE.LinearFilter;
                sharedVideoTexture.magFilter = THREE.LinearFilter;
                sharedVideoTexture.format = THREE.RGBFormat;
              }
              self.createBubble();
            } else {
              setTimeout(waitForVideo, 200);
            }
          } else {
            self.createBubble();
          }
        }
        waitForVideo();
      },

      createBubble: function () {
        const THREE = window.THREE;
        if (!THREE || !sharedVideoTexture) return;

        // Clean up previous mesh
        if (this.mesh) {
          this.el.removeObject3D('mesh');
          if (this.mesh.geometry) this.mesh.geometry.dispose();
          if (this.mesh.material) this.mesh.material.dispose();
          this.mesh = null;
        }

        // REDUCED polygon count: 16x16 instead of 32x32
        const geom = new THREE.SphereGeometry(this.data.radius, 16, 16);
        const mat = new THREE.MeshBasicMaterial({
          map: sharedVideoTexture,  // Use shared texture
          transparent: true,
          opacity: 0.2,  // Slightly reduced opacity for better performance
          side: THREE.BackSide,
          depthWrite: false,
          depthTest: true
        });

        this.mesh = new THREE.Mesh(geom, mat);
        this.mesh.renderOrder = 2;
        
        // Enable frustum culling
        this.mesh.frustumCulled = true;
        
        this.el.setObject3D('mesh', this.mesh);
      },

      update: function (oldData) {
        if (!oldData) return;
        if (oldData.radius !== this.data.radius && sharedVideoTexture) {
          this.createBubble();
        }
      },

      remove: function () {
        if (this.mesh) {
          this.el.removeObject3D('mesh');
          if (this.mesh.geometry) this.mesh.geometry.dispose();
          if (this.mesh.material) this.mesh.material.dispose();
          this.mesh = null;
        }
      }
    });

    // ---- SIMPLIFIED Force Phong ----
    AFRAME.registerComponent('force-phong', {
      schema: {
        shininess: { default: 100 }, // Reduced from 180
        baseOpacity: { default: 0.08 }
      },
      init() {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;

          obj.traverse(n => {
            if (!n.isMesh || !n.material) return;

            const base = n.material;
            // Use MeshLambertMaterial instead of Phong for better performance
            const lambert = new THREE.MeshLambertMaterial({
              color: 0x222244,
              emissive: 0x060a2e,
              transparent: true,
              opacity: (typeof base.opacity === 'number') ? base.opacity : this.data.baseOpacity,
              side: THREE.DoubleSide,
              depthWrite: false
            });

            if (base.map) lambert.map = base.map;
            n.material = lambert;
            n.material.needsUpdate = true;
          });
        });
      }
    });

    // ------------------ Optimized Bubble Fade ------------------
    AFRAME.registerComponent('bubble-fade', {
      schema: {
        from: { type: 'number', default: 0.07 },
        to: { type: 'number', default: 0.0 },
        dur: { type: 'number', default: 8000 },
        delay: { type: 'number', default: 4000 }
      },
      init() {
        this.materials = [];
        this.startTime = null;
        this.isAnimating = false;
        this.lastUpdate = 0;

        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;
          obj.traverse(n => {
            if (n.isMesh && n.material) {
              this.materials.push(n.material);
            }
          });
        });

        this.el.addEventListener('start-fade', () => {
          setTimeout(() => {
            this.startTime = performance.now();
            this.isAnimating = true;
          }, this.data.delay);
        });
      },
      tick() {
        if (!this.isAnimating || !this.startTime) return;
        
        // Throttle updates to 30fps
        const now = performance.now();
        if (now - this.lastUpdate < 33) return;
        this.lastUpdate = now;
        
        const elapsed = now - this.startTime;
        const progress = Math.min(elapsed / this.data.dur, 1);
        const newOp = this.data.from * (1 - progress) + this.data.to * progress;

        this.materials.forEach(m => {
          m.opacity = newOp;
          m.needsUpdate = true;
        });

        if (progress >= 1) this.isAnimating = false;
      }
    });

    // ------------------ Poem Data ------------------
    const POEM = [
      { text: "are" },
      { text: "you" },
      { text: "seeing" },
      { text: "mirrors" },
      { text: "seeing" },
      { text: "only" },
      { text: "what" },
      { text: "pleases" },
      { text: "reflections" },
      { text: "sameness" },
      { text: "comfort" },
      { text: "or bursting" },
      { text: "learning" },
      { text: "growing" },
    ];

    // ------------------ OPTIMIZED Bubble Logic ------------------
    window.addEventListener('DOMContentLoaded', () => {
      const rig = document.querySelector('#rig');
      const MAX_BUBBLES = 3;      // REDUCED from 5 to 3
      const SPAWN_INTERVAL = 3000; // INCREASED from 2000ms

      let currentIndex = 0;
      let activeContainers = [];
      let isProcessingClick = false; // Debounce clicks

      function removeContainer(container) {
        activeContainers = activeContainers.filter(c => c !== container);
        if (rig.contains(container)) {
          rig.removeChild(container);
        }
      }

      function randomBubbleStartPosition() {
        const radius = 1 + Math.random() * 0.7;
        const angle = (Math.random() - 0.5) * Math.PI / 3;
        const x = Math.sin(angle) * radius;
        const z = -Math.cos(angle) * radius;
        const y = -0.6 + Math.random() * 0.2;
        return { x, y, z };
      }

      function spawnBubble() {
        if (activeContainers.length >= MAX_BUBBLES) return;

        const container = document.createElement('a-entity');
        const startPos = randomBubbleStartPosition();

        const startY = startPos.y;
        const endY = startY + 1.6 + Math.random() * 0.4;

        container.setAttribute('position', `${startPos.x} ${startY} ${startPos.z}`);
        container.setAttribute('rotation',
          `${15 + (Math.random()*10-5)} ${15 + (Math.random()*20-10)} ${15 + (Math.random()*10-5)}`);
        container.setAttribute('scale', '2 2 2');

        const riseDur = 20000 + Math.random() * 5000; // SLOWER rise: 20-25s

        container.setAttribute(
          'animation__rise',
          `property: position; dur: ${riseDur}; easing: linear; to: ${startPos.x} ${endY} ${startPos.z}`
        );

        container.addEventListener('animationcomplete__rise', () => {
          if (rig.contains(container)) {
            removeContainer(container);
          }
        });

        // Inner wobble GLB
        const model = document.createElement('a-entity');
        model.setAttribute('gltf-model', '#myModel');
        model.setAttribute('force-phong', 'shininess:100');
        model.setAttribute('animation-mixer', 'loop: repeat');
        model.setAttribute('position', '0 0 0');
        container.appendChild(model);

        // Outer webcam shell
        const webcamShell = document.createElement('a-entity');
        webcamShell.setAttribute('position', '0 0 0');

        model.addEventListener('model-loaded', () => {
          const THREE = window.THREE;
          const obj = model.getObject3D('mesh');
          if (!obj || !THREE) return;

          const box = new THREE.Box3().setFromObject(obj);
          const size = new THREE.Vector3();
          box.getSize(size);

          const wobbleRadiusWorld = Math.max(size.x, size.y, size.z) / 2;
          const containerScale = container.object3D.getWorldScale(new THREE.Vector3());
          const maxScale = Math.max(containerScale.x, containerScale.y, containerScale.z) || 1;
          const wobbleRadiusLocal = wobbleRadiusWorld / maxScale;
          const shellRadiusLocal = wobbleRadiusLocal * 0.5;

          webcamShell.setAttribute('webcam-bubble', `radius:${shellRadiusLocal}`);
        });

        container.appendChild(webcamShell);

        // Click helper
        const clickSphere = document.createElement('a-sphere');
        clickSphere.setAttribute('radius', '0.35');
        clickSphere.setAttribute('material', 'opacity:0; transparent:true');
        clickSphere.classList.add('clickable');
        container.appendChild(clickSphere);

        // Click handler with debounce
        container.addEventListener('click', () => {
          if (isProcessingClick) return;
          isProcessingClick = true;
          setTimeout(() => { isProcessingClick = false; }, 500);

          const stanza = POEM[currentIndex];
          currentIndex = (currentIndex + 1) % POEM.length;

          const THREE = window.THREE;
          const worldPos = container.object3D.getWorldPosition(new THREE.Vector3());
          const worldRot = container.object3D.rotation;
          const worldScale = container.object3D.getWorldScale(new THREE.Vector3());

          removeContainer(container);

          // Split GLB
          const split = document.createElement('a-entity');
          split.setAttribute('gltf-model', '#mySplit');
          split.setAttribute('position',
            `${worldPos.x} ${worldPos.y} ${worldPos.z}`);
          split.setAttribute('rotation',
            `${worldRot.x * 180/Math.PI} ${worldRot.y * 180/Math.PI} ${worldRot.z * 180/Math.PI}`);
          split.setAttribute('scale',
            `${worldScale.x} ${worldScale.y} ${worldScale.z}`);
          split.setAttribute('force-phong', 'shininess:100');
          split.setAttribute('bubble-fade',
            'from:0.07; to:0; dur:8000; delay:4000');
          split.setAttribute('animation-mixer',
            'clip:*; loop:once; repetitions:1; clampWhenFinished:true');
          rig.appendChild(split);

          setTimeout(() => {
            split.emit('start-fade');
          }, 100);

          // Text
          const txt = document.createElement('a-entity');
          txt.setAttribute('text', {
            value: stanza.text,
            color: '#A8DBE6',
            align: 'center',
            width: 0.8,
            font: 'kelsonsans' // Use simpler font
          });
          txt.setAttribute('material', 'transparent:true; opacity:1; depthTest:false');
          txt.setAttribute('position',
            `${worldPos.x} ${worldPos.y} ${worldPos.z + 0.4}`);
          txt.setAttribute('look-at', '[camera]');
          txt.setAttribute(
            'animation__fadeout',
            'property: material.opacity; from:1; to:0; dur:1500; startEvents: fade-out'
          );
          rig.appendChild(txt);

          setTimeout(() => {
            txt.emit('fade-out');
          }, 5000);

          setTimeout(() => {
            if (rig.contains(txt)) rig.removeChild(txt);
            if (rig.contains(split)) rig.removeChild(split);
          }, 13000);
        });

        rig.appendChild(container);
        activeContainers.push(container);
      }

      // Spawn bubbles on interval
      setInterval(() => {
        spawnBubble();
      }, SPAWN_INTERVAL);

      // Initial bubbles with staggered spawn
      setTimeout(() => spawnBubble(), 0);
      setTimeout(() => spawnBubble(), 1000);
      setTimeout(() => spawnBubble(), 2000);
    });

    // Preload models
    window.addEventListener('load', () => {
      const loader = new THREE.GLTFLoader();
      ['wobble5.glb', 'BubbleSplit.glb'].forEach(url => {
        loader.load(url, () => {
          console.log(`Preloaded ${url}`);
        });
      });
    });
  </script>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="antialias:true;logarithmicDepthBuffer:true;colorManagement:true;toneMapping:linear;exposure:1.5"
    arjs="sourceType:webcam;trackingMethod:best;debugUIEnabled:false">

    <!-- Assets with preload -->
    <a-assets timeout="30000">
      <a-asset-item id="myModel" src="wobble5.glb"></a-asset-item>
      <a-asset-item id="mySplit" src="BubbleSplit.glb"></a-asset-item>
    </a-assets>

    <!-- AR Camera with rig -->
    <a-entity camera arjs-camera id="arCam">
      <a-entity id="rig">
        <!-- SIMPLIFIED Lights (reduced from 5 to 3) -->
        <a-entity light="type:ambient; intensity:8; color:#FA7AAE"></a-entity>
        <a-entity position="1 2 -1"
                  light="type:directional; intensity:6; color:#8BFCFC"></a-entity>
        <a-entity position="0 1 0"
                  light="type:point; intensity:8; distance:3; color:#FFFFFF"></a-entity>
      </a-entity>
    </a-entity>

    <!-- Mouse raycaster -->
    <a-entity
      cursor="rayOrigin: mouse; fuse:false"
      raycaster="objects:.clickable; far:100; interval:100">
    </a-entity>

  </a-scene>
</body>
</html>
