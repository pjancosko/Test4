<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bubble Sculpture (Optimized Clones)</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.6/aframe/build/aframe-ar.min.js"></script>
  <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.loaders.min.js"></script>

  <style>body { margin: 0; overflow: hidden; }</style>

  <script>
    // ---------- Force Phong (configurable per entity) ----------
    AFRAME.registerComponent('force-phong', {
      schema: {
        shininess:   { default: 180 },
        baseOpacity: { default: 0.08 },
        depthWrite:  { default: false }
      },
      init () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;

          obj.traverse(n => {
            if (!n.isMesh || !n.material) return;

            const base = n.material;
            const phong = new THREE.MeshPhongMaterial({
              color:       0x222244,
              emissive:    0x060a2e,
              specular:    0xffffff,
              shininess:   this.data.shininess,
              transparent: true,
              opacity:     (typeof base.opacity === 'number') ? base.opacity : this.data.baseOpacity,
              side:        THREE.DoubleSide,
              depthWrite:  this.data.depthWrite
            });

            if (base.map)       phong.map       = base.map;
            if (base.normalMap) phong.normalMap = base.normalMap;

            n.material = phong;
            n.material.needsUpdate = true;
          });
        });
      }
    });

    // ---------- Helper: deep clone a loaded Object3D ----------
    function cloneObject3D(src) {
      return src.clone(true);
    }

    // ---------- Mobile audio unlock (fixes "no sound on phone") ----------
    function setupAudioUnlock() {
      const popSound = document.querySelector('#popSound');
      if (!popSound) return;

      let unlocked = false;
      const unlock = () => {
        if (unlocked) return;
        unlocked = true;
        try {
          popSound.muted = false;
          popSound.volume = 0.7;
          // Play silently for a moment, then pause/reset (unlocks on iOS/Android)
          popSound.play().then(() => {
            popSound.pause();
            popSound.currentTime = 0;
          }).catch(()=>{});
        } catch(e) {}
        window.removeEventListener('touchend', unlock);
        window.removeEventListener('pointerup', unlock);
      };

      window.addEventListener('touchend', unlock, { once: true });
      window.addEventListener('pointerup', unlock, { once: true });
    }

    // ---------- Bubble Pop ----------
    AFRAME.registerComponent('bubble-pop', {
  schema: {
    splitScaleMultiplier: { default: 1.5 },
    fadeDuration: { default: 2000 } // fade AFTER animation finishes
  },

  init() {
    this.popped = false;
    this.el.classList.add('clickable');

    this.onInteract = this.onInteract.bind(this);
    this.el.addEventListener('click', this.onInteract);
    this.el.addEventListener('touchstart', this.onInteract);
  },

  onInteract() {
    this.popBubble();
  },

  popBubble() {
    if (this.popped) return;
    this.popped = true;

    const el = this.el;
    const parent = el.parentNode;
    if (!parent) return;

    // --- play pop sound ---
    const popSound = document.querySelector('#popSound');
    if (popSound) {
      try {
        popSound.pause();
        popSound.currentTime = 0;
        popSound.volume = 0.7;
        popSound.play().catch(() => {});
      } catch (e) {}
    }

    // save transform
    const pos = el.getAttribute('position');
    const rot = el.getAttribute('rotation');
    const scale = el.getAttribute('scale');

    // hide original bubble
    el.setAttribute('visible', false);

    // --- create split ---
    const split = document.createElement('a-entity');
    split.setAttribute('position', pos);
    split.setAttribute('rotation', rot);

    const s = scale.x * this.data.splitScaleMultiplier;
    split.setAttribute('scale', `${s} ${s} ${s}`);

    split.setAttribute('gltf-model', '#bubbleSplitModel');
    split.setAttribute(
      'force-phong',
      'baseOpacity: 0.85; shininess: 120; depthWrite: true'
    );

    // --- wait for model, play animation, THEN fade ---
    split.addEventListener('model-loaded', () => {

      // play whatever animation exists
      split.setAttribute(
        'animation-mixer',
       'loop: once; clampWhenFinished: true'
      );

      // after animation finishes → fade out
      split.addEventListener('animation-finished', () => {
        this.fadeOutSplit(split);
      }, { once: true });

    });

    parent.appendChild(split);
  },

  fadeOutSplit(splitEl) {
    const mesh = splitEl.getObject3D('mesh');
    if (!mesh) return;

    const materials = [];

    mesh.traverse(n => {
      if (n.isMesh && n.material) {
        n.material = n.material.clone();
        n.material.transparent = true;
        n.material.depthWrite = true;

        materials.push({
          material: n.material,
          startOpacity: n.material.opacity ?? 1
        });
      }
    });

    const duration = this.data.fadeDuration;
    const startTime = performance.now();

    const fade = (now) => {
      const t = Math.min((now - startTime) / duration, 1);

      materials.forEach(m => {
        m.material.opacity = m.startOpacity * (1 - t);
      });

      if (t < 1) {
        requestAnimationFrame(fade);
      } else {
        splitEl.parentNode?.removeChild(splitEl);
      }
    };

    requestAnimationFrame(fade);
  },

  remove() {
    this.el.removeEventListener('click', this.onInteract);
    this.el.removeEventListener('touchstart', this.onInteract);
  }
}); // ✅ closes bubble-pop registerComponent

    // ---------- Random bubble ring (clones bubble template mesh) ----------
    AFRAME.registerComponent('random-bubble-ring', {
      schema: {
        count:        { default: 8 },
        radius:       { default: 5 },
        y:            { default: 0 },
        scale:        { default: 9 },
        radiusJitter: { default: 1.0 },
        heightJitter: { default: 1.0 },
        depthJitter:  { default: 1.2 },
        scaleJitter:  { default: 0.9 }
      },

      init() {
        const templateEl = document.querySelector('#bubbleTemplate');

        const build = () => {
          const templateMesh = templateEl && templateEl.getObject3D('mesh');
          if (!templateMesh) return;

          const data = this.data;

          for (let i = 0; i < data.count; i++) {
            const angle = (i / data.count) * Math.PI * 2;

            const radialOffset = (Math.random() - 0.5) * data.radiusJitter;
            const r = data.radius + radialOffset;

            let x = Math.cos(angle) * r;
            let z = Math.sin(angle) * r;

            z += (Math.random() - 0.5) * data.depthJitter;
            const y = data.y + (Math.random() - 0.5) * data.heightJitter;

            const scaleFactor = 1 - data.scaleJitter / 2 + Math.random() * data.scaleJitter;
            const finalScale = data.scale * scaleFactor;

            const bubble = document.createElement('a-entity');

            bubble.addEventListener('loaded', () => {
              const clone = cloneObject3D(templateMesh);
              bubble.setObject3D('mesh', clone);
            });

            bubble.setAttribute('bubble-pop', '');
            bubble.setAttribute('position', `${x} ${y} ${z}`);
            bubble.setAttribute('scale', `${finalScale} ${finalScale} ${finalScale}`);
            bubble.setAttribute(
              'rotation',
              `${(Math.random() - 0.5) * 20} ${(Math.random()*360).toFixed(1)} ${(Math.random() - 0.5) * 20}`
            );

            this.el.appendChild(bubble);
          }
        };

        if (templateEl) {
          templateEl.addEventListener('model-loaded', build);
          if (templateEl.hasLoaded && templateEl.getObject3D('mesh')) build();
        }
      }
    });
  </script>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="antialias:true; colorManagement:true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled:false">

    <!-- Camera + cursor -->
    <a-camera>
      <a-entity
        cursor="rayOrigin: entity; fuse: true; fuseTimeout: 80"
        raycaster="objects: .clickable; far: 100"
        geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
        material="color: #FFFFFF; shader: flat; opacity: 0.9"
        position="0 0 -1">
      </a-entity>
    </a-camera>

    <!-- Assets -->
    <a-assets timeout="60000">
      <a-asset-item id="bubbleModel" src="wobble5.glb"></a-asset-item>
      <a-asset-item id="bubbleSplitModel" src="BubbleSplit.glb"></a-asset-item>
      <audio id="popSound" src="bubble-pop-06-351337.mp3" preload="auto" playsinline webkit-playsinline></audio>
    </a-assets>

    <!-- Hidden templates (bubble only needs clone optimization) -->
    <a-entity id="bubbleTemplate"
              gltf-model="#bubbleModel"
              force-phong="baseOpacity: 0.08; shininess: 180; depthWrite: false"
              visible="false"></a-entity>

    <!-- Lights -->
    <a-entity light="type:ambient; intensity:6; color:#FA7AAE"></a-entity>
    <a-entity position="1 2 -1"  light="type:directional; intensity:4; color:#8BFCFC"></a-entity>
    <a-entity position="-2 2 1" light="type:directional; intensity:4; color:#E65E63"></a-entity>
    <a-entity light="type:hemisphere; color:#AAFFFF; groundColor:#0088FF; intensity:1.5"></a-entity>

    <!-- Sculpture -->
    <a-entity
      id="bubble-sculpture"
      position="0 -0.5 -6"
      animation__float="property: position.y; from:-0.8; to:0.8; dur:14000; dir:alternate; loop:true; easing:easeInOutSine">

      <!-- Center bubble -->
      <a-entity id="centerBubble" bubble-pop position="0 0 0" scale="30 30 30"></a-entity>

      <!-- Rings (TOTAL bubbles = 5 + 5 + 4 + center = 15) -->
      <a-entity
        id="ring-outer"
        animation__spin="property: rotation.y; to:360; loop:true; dur:50000; easing:linear"
        random-bubble-ring="count:5; radius:3; y:0; scale:12; radiusJitter:1.5; heightJitter:1.2; depthJitter:1.5; scaleJitter:0.8">
      </a-entity>

      <a-entity
        id="ring-upper"
        animation__spin="property: rotation.y; to:-360; loop:true; dur:60000; easing:linear"
        random-bubble-ring="count:5; radius:2.6; y:2.0; scale:12; radiusJitter:0.8; heightJitter:0.8; depthJitter:1.0; scaleJitter:0.4">
      </a-entity>

      <a-entity
        id="ring-lower"
        animation__spin="property: rotation.y; to:360; loop:true; dur:55000; easing:linear"
        random-bubble-ring="count:4; radius:2.4; y:-2.0; scale:12; radiusJitter:1.0; heightJitter:1.0; depthJitter:1.3; scaleJitter:0.6">
      </a-entity>
    </a-entity>

    <script>
      // Unlock audio on mobile once
      setupAudioUnlock();

      // Clone template mesh into center bubble once template is loaded
      const templateEl = document.querySelector('#bubbleTemplate');
      const centerEl = document.querySelector('#centerBubble');

      templateEl.addEventListener('model-loaded', () => {
        const mesh = templateEl.getObject3D('mesh');
        if (!mesh) return;
        const clone = mesh.clone(true);
        centerEl.setObject3D('mesh', clone);
      });
    </script>

  </a-scene>
</body>
</html>
